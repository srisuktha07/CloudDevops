name: The Node & Redis Project

on: 
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:  
  build-test: 
    runs-on: ubuntu-latest
    
    # ✅ NEW: Add Docker service
    services:
      docker:
        image: docker:20.10
        options: --privileged

    strategy:
      matrix:
        node-version: [16, 18]

    env:
      PORT: 4001

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install 

      - name: Run Tests
        run: npm test  # ✅ FIXED: Actually run tests

      - name: Build Docker Image
        run: docker build -t myapp:${{ matrix.node-version }} .

      - name: Run Container Tests
        run: docker run --rm myapp:${{ matrix.node-version }} npm test

      - name: Display Running Containers
        run: docker ps -a
